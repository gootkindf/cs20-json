<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .product { border: 1px solid #ccc; border-radius: 6px; padding: .75rem 1rem; margin: .75rem 0; background: #fafafa; }
        .product h2 { margin: 0 0 .25rem; font-size: 1.15rem; }
        .product p { margin: .2rem 0; }
        .price { font-weight: bold; color: #1a6b2f; }
        .categories { font-style: italic; color: #555; }
    </style>
</head>
<body>
    <script>
    fetch('https://pokeapi.co/api/v2/pokemon/tyranitar')
        .then(response => response.json())
        .then(data => {
            console.log(data);
            var s = "<p> Pokemon Info </p>";
            // for (var i = 0; i < data.length; i++){
                s += '<div class="pokemon">' + 
                    '<h3>' + data.name + '</h3>' +
                    '<p>' + data.id + '</p>' +
                    '<p>' + data.height + '</p>' +
                    '<p>' + data.weight + '</p>' +
                    // '<p>' + data.types + '</p>' +
                    '<img src="' + data.sprites.front_default + '">' +                    '</div>';
            document.getElementById("placeholder").innerHTML = s;

            })
        .catch(error => console.error('Error fetching data:', error));

    </script>
    <div id='placeholder'>&nbsp;</div>
</body>
</html>
