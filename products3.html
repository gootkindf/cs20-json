<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
        .product { border: 1px solid #ccc; border-radius: 6px; padding: .75rem 1rem; margin: .75rem 0; background: #fafafa; }
        .product h2 { margin: 0 0 .25rem; font-size: 1.15rem; }
        .product p { margin: .2rem 0; }
        .price { font-weight: bold; color: #1a6b2f; }
        .categories { font-style: italic; color: #555; }
            select { padding: .4rem; font-size: 1rem; }
    </style>
</head>
<body>
    <h1>Product Catalog</h1>
    <select id="categorySelect"></select>
    <button id="filterButton">Filter</button>
    <div id="filterResult"></div>

    <button id="loadProductsButton">Load Products</button>

    <div id="result"></div>

    <script>
        $("#loadProductsButton").click(function () {
            $.get("products.json", function (data) {
                var products = (typeof data === "string") ? JSON.parse(data) : data;
                var html = "";
                for (var i = 0; i < products.length; i++) {
                    var p = products[i];
                    html += '<div class="product">' +
                            '<h2>' + p.name + '</h2>' +
                            '<p>' + p.description + '</p>' +
                            '<p class="price">Price: $' + p.price + '</p>' +
                            '<p class="categories">Categories: ' + p.categories.join(", ") + '</p>' +
                            '</div>';
                }
                document.getElementById("result").innerHTML = html;
            });
        });

        var allProducts = [];

        $(function () {
            $.get("products.json", function (data) {
                allProducts = (typeof data === "string") ? JSON.parse(data) : data;
                var categories = [];
                for (var i = 0; i < allProducts.length; i++) {
                    for (var j = 0; j < allProducts[i].categories.length; j++) {
                        var c = allProducts[i].categories[j];
                        if (categories.indexOf(c) === -1) categories.push(c);
                    }
                }
                categories.sort();
                var options = "";
                for (var k = 0; k < categories.length; k++) {
                    options += '<option value="' + categories[k] + '">' + categories[k] + '</option>';
                }
                document.getElementById("categorySelect").innerHTML = options;
            });
        });

        $("#filterButton").click(function () {
            var chosen = document.getElementById("categorySelect").value;
            var html = "";
            for (var i = 0; i < allProducts.length; i++) {
                if (allProducts[i].categories.indexOf(chosen) !== -1) {
                    html += "<p>" + allProducts[i].name + "</p>";
                }
            }
            document.getElementById("filterResult").innerHTML = html;
        });
    </script>
</body>
</html>
